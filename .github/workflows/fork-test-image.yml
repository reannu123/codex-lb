name: Publish fork test image

# Intentionally manual to avoid extra CI minutes and unreviewed GHCR pushes.
# Once this workflow exists on the default branch, use Actions > Run workflow
# and select the tested ref. Uses the selected ref, not an untrusted PR context.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-test-image:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish test image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:staggered-warmup-test
          cache-from: type=gha,scope=fork-staggered-warmup
          cache-to: type=gha,mode=max,scope=fork-staggered-warmup
